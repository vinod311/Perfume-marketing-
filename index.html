<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243a"><title>Trivenkem Fragrance Catalogue</title><style>
:root{--bg:#f3f6fa;--card:#fff;--text:#17202a;--muted:#64748b;--line:#dce3eb;--gold:#d99b22;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial}header{background:#10243a;color:#fff;padding:18px max(16px,calc((100% - 980px)/2)) 14px}header h1{margin:0;font-size:22px;letter-spacing:.08em}header p{margin:2px 0 0;color:#cbd5e1;font-size:12px}.wrap{max-width:980px;margin:auto;padding:14px 14px 100px}.search{display:flex;gap:8px;margin:8px 0 12px}.search input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}.search button,.btn{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:#fff;color:var(--text);font:inherit;cursor:pointer}.btn.y{background:#10243a;color:#fff;border-color:#10243a}.btn.r{color:#b91c1c}.mut{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px;margin:10px 0;box-shadow:0 2px 9px #17202a08}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.chip,.ap{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:#fff;color:var(--text);font-size:12px;text-decoration:none;cursor:pointer}.chip.on{background:#10243a;color:#fff;border-color:#10243a}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tag{font-size:11px;padding:3px 7px;border-radius:99px;background:#fef3c7}.star{border:0;background:transparent;font-size:24px;color:#d99b22;cursor:pointer}.ap.ok{background:#ecfdf5;color:#166534}.ap.no{background:#f1f5f9;color:#64748b}.big{padding:10px;background:#fffbeb;border-radius:8px;margin:10px 0}label{display:block;margin:12px 0 5px;font-weight:600;font-size:13px}input[type=text],input[type=password],input[type=file],select,textarea{max-width:100%;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}input[type=checkbox],input[type=radio]{width:auto}.chk{display:inline-flex;align-items:center;gap:6px;margin:7px 12px 7px 0;font-weight:400}#nav{display:flex;gap:8px;overflow:auto;padding:8px 0 12px;border-bottom:1px solid var(--line)}#nav a{white-space:nowrap;text-decoration:none;color:#475569;padding:7px 10px;border-radius:8px;font-size:13px}#nav a.on{background:#10243a;color:#fff}#cnt{font-size:12px;color:var(--muted);margin-left:auto;align-self:center;white-space:nowrap}#fab{position:fixed;right:18px;bottom:18px;z-index:10;border:0;border-radius:999px;padding:14px 18px;background:#d99b22;color:#111827;font-weight:700;box-shadow:0 5px 20px #0003}#clr{border:0;background:transparent;color:#64748b;font-size:20px}a{color:#175ea8}.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#17202a;color:#fff;padding:10px 16px;border-radius:9px;z-index:10000;box-shadow:0 3px 16px #0003}h2{font-size:20px}h4{margin:3px 0 8px}@media(min-width:700px){.card{padding:18px}}
